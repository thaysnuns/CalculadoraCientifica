<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcSábio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- <h1>Calculadora Sábia</h1> -->
    <section class="conteiner-principal">
        <input type="text" id="display">
        <div class="normal">
            <div class="linha">
                <button id="btnLimpar">C</button>
                <button id="btnAbrePar">(</button>
                <button id="btnFechaPar">)</button>
                <button id="btnApagarUm">Del</button>
            </div>
            <div class="linha">
                <button id="btn7">7</button>
                <button id="btn8">8</button>
                <button id="btn9">9</button>
                <button id="btnDiv">/</button>
            </div>
            <div class="linha">
                <button id="btn4">4</button>
                <button id="btn5">5</button>
                <button id="btn6">6</button>
                <button id="btnMult">*</button>
            </div>
            <div class="linha">
                <button id="btn1">1</button>
                <button id="btn2">2</button>
                <button id="btn3">3</button>
                <button id="btnSub">-</button>
            </div>
            <div class="linha">
                <button id="btn0">0</button>
                <button id="btnPonto">.</button>
                <button id="btnIgual">=</button>
                <button id="btnSoma">+</button>
            </div>

            <button class="pullout">Modo Científico</button>

            <div class="cientifica">
                <div class="linha">
                    <button id="btnLog">Log</button>
                    <button id="btnSen">Sen</button>
                    <button id="btnCos">Cos</button>
                </div>

                <div class="linha">
                    <button id="btnTg">Tg</button>
                    <button id="btnLn">Ln</button>
                    <button id="btnExp">Exp</button>
                </div>

                <div class="linha">
                    <button id="btnPow">^</button>
                    <button id="btnRad">Rad</button>
                    <button id="btnFat">!</button>
                    <button id="btnPorc">%</button>
                </div>

                <div class="linha">
                    <button id="btnPi">π</button>
                    <button id="btnE">e</button>
                    <button id="btnRaiz">Raiz</button>
                    <button id="btnInverso">1/x</button>
                    <button id="btnCotg">Cotg</button>
                    <button id="btnSec">Sec</button>
                    <button id="btnCossec">Cossec</button>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <p>Desenvolvido por Thay Nunes &copy; 2025</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
